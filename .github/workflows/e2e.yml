name: E2E Tests - Cypress

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    services:
      mysql: # optional if you need DB service
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # --- Checkout Frontend Repo ---
      - name: Checkout Frontend
        uses: actions/checkout@v4

      # --- Checkout Backend Repo ---
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: lukaszmosionek/mamfachowca_BACKEND_LaravelAPI
          path: backend

      # --- Setup PHP & Laravel ---
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot; do
            echo "Waiting for MySQL..."
            sleep 5
          done

      - name: Install Laravel Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: |
           cd backend
           php artisan migrate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run server
        run: |
          php artisan serve --host=0.0.0.0 --port=8000 &

      # --- Setup Node & Frontend ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: npm ci

      # Start your dev server in the background
      - name: Start Vite server
        run: npm run dev &
      
      # Wait for the server to be up
      - name: Wait for server
        run: npx wait-on http://localhost:5173

      - name: Run Cypress tests
        run: npx cypress run --browser chrome --headless -- --no-sandbox --disable-dev-shm-usage --record --key 3b36aa75-fa7c-4197-a18b-d1da9fa16292



